name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compute next version tag (v1.0.N)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$LAST" ] || [ "$LAST" = "null" ]; then LAST="v1.0.0"; fi
          N=$(( ${LAST##*.} + 1 ))
          echo "tag=v1.0.$N" >> "$GITHUB_OUTPUT"
          echo "code=$N" >> "$GITHUB_OUTPUT"
          echo "上一版: $LAST -> 新版: v1.0.$N (versionCode=$N)"

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          test -s release.keystore && echo "keystore 已恢复"

      - name: Build signed release APK
        run: |
          gradle assembleRelease --no-daemon \
            -PverCode=${{ steps.ver.outputs.code }} \
            -PverName=1.0.${{ steps.ver.outputs.code }} \
            -PksFile=release.keystore \
            -PksPass="${{ secrets.KS_PASS }}" \
            -PksAlias="${{ secrets.KEY_ALIAS }}" \
            -PksPass2="${{ secrets.KEY_PASS }}"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             OfflineTranscriber-${{ steps.ver.outputs.tag }}.apk
          ls -lh OfflineTranscriber-*.apk

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 离线转写 v1.0.${{ steps.ver.outputs.code }}
          body: |
            自动构建（CI 签名发布）。

            - 已安装旧版：直接覆盖安装，数据与已下载的识别模型全部保留
            - 也可在 App 内「设置 → 检查更新」一键升级
          files: OfflineTranscriber-${{ steps.ver.outputs.tag }}.apk
